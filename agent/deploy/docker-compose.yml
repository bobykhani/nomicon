# Nomicon agent behind Caddy, which terminates TLS for NOMICON_DOMAIN.
# Host layout (see ../RUNBOOK.md):
#   /srv/nomicon/repo      clone of the repository; ledger/ is written here
#   /srv/nomicon/private   doorbell addresses (never published)
#   /srv/nomicon/secrets   ledger.pem, github-app.pem, agent.env (mode 600)
#   /srv/nomicon/sites     optional extra Caddy site blocks (*.caddy), owner-maintained
#   /srv/nomicon/www       files those sites serve, such as the contact page; never in the repository
# NOMICON_HOME (default /srv/nomicon) moves repo/, private/ and secrets/ elsewhere, for a second
# instance such as a test network run; give it its own COMPOSE_PROJECT_NAME in deploy/.env.
# sites/ and www/ are the owner's pages and stay at /srv/nomicon whichever instance serves them.
# Logs go to journald, which keeps them 30 days (PRIVACY.md); see RUNBOOK.md.
services:
  agent:
    build: { context: .., dockerfile: deploy/Dockerfile }
    restart: unless-stopped
    env_file: ${NOMICON_HOME:-/srv/nomicon}/secrets/agent.env
    environment:
      NOMICON_REPO_ROOT: /data/repo
      NOMICON_DATA_DIR: /data/private
      NOMICON_LEDGER_KEY: /run/nomicon/ledger.pem
      GITHUB_APP_PRIVATE_KEY: /run/nomicon/github-app.pem
      NOMICON_TRUST_PROXY: "1"
      NOMICON_PORT: "8402"
    volumes:
      - ${NOMICON_HOME:-/srv/nomicon}/repo:/data/repo
      - ${NOMICON_HOME:-/srv/nomicon}/private:/data/private
      - ${NOMICON_HOME:-/srv/nomicon}/secrets:/run/nomicon:ro
    expose: ["8402"]
    logging: { driver: journald }
  caddy:
    image: caddy:2.9-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      NOMICON_DOMAIN: ${NOMICON_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /srv/nomicon/sites:/etc/caddy/sites:ro
      - /srv/nomicon/www:/srv/www:ro
      - caddy_data:/data
      - caddy_config:/config
    logging: { driver: journald }
volumes:
  caddy_data:
  caddy_config:
